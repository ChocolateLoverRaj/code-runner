[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
bootloader_api = "0.11.10"
bytemuck = { version = "1.21.0", default-features = false }
embedded-graphics = "0.8.1"
limine = "0.4.0"
postcard = { version = "1.1.1", features = ["experimental-derive"] }
serde = { version = "1.0.217", features = ["derive", "alloc"], default-features = false }
thiserror = { version = "2.0.12", default-features = false }
uuid = { version = "1.16.0", default-features = false, features = ["serde"] }
zerocopy = { version = "0.8.23", features = ["derive"] }
