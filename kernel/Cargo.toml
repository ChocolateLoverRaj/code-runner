[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
embedded-graphics = "0.8.1"
x86_64 = { path = "../x86_64" }
acpi = { version = "5.2.0" }
heapless = "0.8.0"
linked_list_allocator = "0.10.5"
x2apic = { path = "../x2apic-rs" }
unicode-segmentation = "1.12.0"
x86_rtc = "0.1.1"
elf = { version = "0.7.4", default-features = false, features = ["nightly"] }
util = { path = "../util", default-features = false, features = ["log"] }
common = { version = "0.1.0", path = "../common" }
bytemuck = "1.21.0"
volatile = { version = "0.6.1", features = ["derive", "unstable"] }
bitfield = "0.19.0"
uart_16550 = { path = "../uart_16550" }
spinning_top = "0.3.0"
uuid = { version = "1.16.0", features = [], default-features = false }
zerocopy = { version = "0.8.23", features = ["zerocopy-derive"] }
postcard = "1.1.1"
limine = "0.4.0"
owo-colors = "4.2.0"
rand = { version = "0.9.0", default-features = false, features = ["small_rng"] }
thiserror = { version = "2.0.12", default-features = false }
string-alloc = "0.0.3"
rustc-demangle = "0.1.24"
addr2line = { version = "0.24.2", default-features = false, features = [
    "fallible-iterator",
    "rustc-demangle",
] }
rangemap = { version = "1.5.1", features = ["const_fn", "nightly"] }

[dependencies.crossbeam-queue]
version = "0.3.12"
default-features = false
features = ["alloc"]

[dependencies.futures-util]
version = "0.3.31"
default-features = false
features = ["alloc", "async-await", "async-await-macro"]

[dependencies.chrono]
version = "0.4.39"
default-features = false
features = ["alloc"]

[dependencies.log]
version = "0.4.25"
default-features = false

[dependencies.conquer-once]
version = "0.4.0"
default-features = false

[dependencies.lazy_static]
version = "1.5.0"
features = ["spin_no_std"]

[dependencies.num_enum]
version = "0.7.3"
default-features = false

[[bin]]
name = "kernel"
test = false
bench = false
