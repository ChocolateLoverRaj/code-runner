[package]
name = "util"
version = "0.1.0"
edition = "2021"

[dependencies]
atomic_enum = "0.3.0"
heapless = "0.8.0"
thiserror = { version = "2.0.12", default-features = false }
chashmap = { version = "2.2.2", optional = true }
rangemap = { version = "1.5.1", optional = true }
x86_64 = { path = "../x86_64" }
limine = "0.4.0"
log = { version = "0.4.27", optional = true }

[dependencies.futures-util]
version = "0.3.31"
default-features = false
features = ["alloc", "async-await", "async-await-macro"]

[features]
std = ["dep:chashmap", "dep:rangemap"]
log = ["dep:log"]
default = ["std", "log"]
